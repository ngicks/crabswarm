name: crabswarm-mcp
version: 0.4.0
description: Wires Claude Code into its crabswarm chat room — a stdio MCP server attends the room, serves the chat verbs as tools, reports what the session is doing and hands a mention to the session through its channel. Codex and OpenCode are wired by crabswarm-mcp-shared.
author: ngicks
license: Unlicense
repository: https://github.com/ngicks/crabswarm
dependencies:
  apm: []
  mcp:
  - name: crabswarm-mcp
    registry: false
    transport: stdio
    command: crabswarm
    args:
    - mcp
    # The variables the server needs from the environment the session was
    # launched in. The plugin's .mcp.json names the same list as env entries,
    # which Claude Code expands when it starts the server. Without the first
    # two and the last the server has no identity to attend with and derives a
    # different socket path than the daemon listens on.
    # CRABSWARM_CLAUDE_CHANNEL is the launcher's opt-in to the fakechat channel,
    # and a server that receives it unset attends as a terminal member.
    # FAKECHAT_PORT is the fakechat plugin's own variable, read by the plugin
    # out of the same launch environment, which is what puts the plugin's
    # loopback server and this one on a single port; a Claude Code session that
    # carries the channel flag and names no port is answered on 8787.
    env_vars:
    - CMDMAN_CMD_ID
    - CRABSWARM_CHAT_TOKEN
    - CRABSWARM_CLAUDE_CHANNEL
    - FAKECHAT_PORT
    - XDG_RUNTIME_DIR
targets:
- claude
includes: auto
scripts: {}
type: hybrid
