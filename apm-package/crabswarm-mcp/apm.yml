name: crabswarm-mcp
version: 0.2.0
description: Wires an agent harness into its crabswarm chat room — an MCP server attends the room, serves the chat verbs as tools and hands a mention to a harness it can reach itself, and hooks deliver teammates' messages mid-turn and at turn end.
author: ngicks
license: Unlicense
repository: https://github.com/ngicks/crabswarm
dependencies:
  apm: []
  mcp:
  - name: crabswarm-mcp
    registry: false
    transport: stdio
    command: crabswarm
    args:
    - mcp
    # Codex spawns a stdio MCP server with a fixed environment whitelist and
    # forwards nothing else unless the server's own table names it. Without the
    # first two and the last the server has no identity to attend with and
    # derives a different socket path than the daemon listens on. The two in the
    # middle are how a session says it can be woken without the daemon typing at
    # its terminal: the launcher sets the one belonging to the harness it
    # started, and a server that receives neither attends as a terminal member.
    env_vars:
    - CMDMAN_CMD_ID
    - CRABSWARM_CHAT_TOKEN
    - CRABSWARM_CLAUDE_CHANNEL
    - CRABSWARM_CODEX_APP_SERVER
    - XDG_RUNTIME_DIR
targets:
- claude
- codex
- opencode
includes: auto
scripts: {}
type: hybrid
