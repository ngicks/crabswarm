name: crabswarm-mcp-shared
version: 0.1.0
description: Wires Claude Code, Codex and OpenCode into their crabswarm chat room through one shared `crabswarm mcp --transport http`, which serves every replica, including those of a shared Codex app server or opencode serve, as a member of its own.
author: ngicks
license: Unlicense
repository: https://github.com/ngicks/crabswarm
dependencies:
  apm: []
  mcp:
  - name: crabswarm-mcp-shared
    registry: false
    transport: streamable-http
    url: http://127.0.0.1:47300/mcp
targets:
- claude
- codex
- opencode
includes: auto
scripts: {}
type: hybrid
