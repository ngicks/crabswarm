syntax = "proto3";

package crabpreview.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ngicks/crabswarm/api/gen/proto/go/crabpreview/v1;crabpreviewv1";

// PreviewService serves the markdown previewer: root registry, file tree,
// rendered documents, and a live-reload event stream.
service PreviewService {
  // ListRoots returns the currently registered preview roots.
  rpc ListRoots(ListRootsRequest) returns (ListRootsResponse);
  // AddRoot registers a directory path as a preview root and returns it. The
  // path may be relative; the server resolves it to an absolute path. Adding an
  // already-registered path is idempotent.
  rpc AddRoot(AddRootRequest) returns (AddRootResponse);
  // RemoveRoot drops a registered root and its watches.
  rpc RemoveRoot(RemoveRootRequest) returns (RemoveRootResponse);
  // GetTree lists one directory level (all files, dirs first) under a root.
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse);
  // GetDocument renders a markdown file to HTML with its title and TOC.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  // WatchEvents streams live-reload events for registered roots.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
}

// Root is a registered preview root directory.
message Root {
  // ID is a stable identifier derived from the absolute path.
  string id = 1;
  // Path is the absolute directory path.
  string path = 2;
  // Name is the display name (base name, deduplicated across roots).
  string name = 3;
}

// EntryType distinguishes directories from regular files in a tree listing.
enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_DIR = 1;
  ENTRY_TYPE_FILE = 2;
}

// TreeEntry is a single child of a directory in a GetTree listing.
message TreeEntry {
  // Name is the base name of the entry.
  string name = 1;
  // Type is DIR or FILE.
  EntryType type = 2;
  // IsMarkdown reports whether a FILE entry is a markdown document.
  bool is_markdown = 3;
}

// Heading is one entry of a document's table of contents.
message Heading {
  // Level is the heading level (1-4).
  int32 level = 1;
  // Text is the rendered heading text.
  string text = 2;
  // ID is the heading anchor, matching the rendered HTML.
  string id = 3;
}

message ListRootsRequest {}

message ListRootsResponse {
  repeated Root roots = 1;
}

message AddRootRequest {
  // Path is the directory to register. May be relative; the server resolves
  // it to an absolute path.
  string path = 1;
}

message AddRootResponse {
  Root root = 1;
}

message RemoveRootRequest {
  // RootId is the ID of the root to remove.
  string root_id = 1;
}

message RemoveRootResponse {}

message GetTreeRequest {
  // RootId identifies the root to list under.
  string root_id = 1;
  // Path is the directory relative to the root ("" or "." lists the root).
  string path = 2;
}

message GetTreeResponse {
  repeated TreeEntry entries = 1;
}

message GetDocumentRequest {
  // RootId identifies the root the file belongs to.
  string root_id = 1;
  // Path is the markdown file relative to the root.
  string path = 2;
}

message GetDocumentResponse {
  // Html is the rendered markdown as an HTML fragment.
  string html = 1;
  // Title is the document title (first h1, falling back to the file name).
  string title = 2;
  // Toc is the extracted table of contents (levels 1-4).
  repeated Heading toc = 3;
  // Mtime is the source file's last modification time.
  google.protobuf.Timestamp mtime = 4;
}

message WatchEventsRequest {}

// DocChanged signals that a rendered document should be refetched.
message DocChanged {
  string root_id = 1;
  // Path is the changed file relative to the root.
  string path = 2;
}

// TreeChanged signals that a directory listing should be refetched.
message TreeChanged {
  string root_id = 1;
  // Dir is the changed directory relative to the root.
  string dir = 2;
}

// RootsChanged signals that the root registry changed.
message RootsChanged {}

// WatchEventsResponse is a single live-reload notification.
message WatchEventsResponse {
  oneof event {
    DocChanged doc_changed = 1;
    TreeChanged tree_changed = 2;
    RootsChanged roots_changed = 3;
  }
}
