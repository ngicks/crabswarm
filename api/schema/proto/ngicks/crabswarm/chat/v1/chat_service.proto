syntax = "proto3";

package ngicks.crabswarm.chat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ngicks/crabswarm/api/gen/proto/go/ngicks/crabswarm/chat/v1;chatv1";

// ChatService brokers per-room chat between the agents (and humans) attending
// a room. Every RPC carries the caller's identity token as the gRPC metadata
// "x-crabswarm-token"; Attend resolves it through the team-info provider, every
// other RPC resolves it to the member attending under it, and a token nobody
// attends under is rejected. Room and team are never chosen by the caller: they
// follow from the token.
service ChatService {
  // Attend declares attendance and holds it for as long as the stream is
  // open. The first event is Attended, carrying the member the token
  // resolved to; the rest is the room's event feed. Closing the stream is
  // leaving. A token already attending is refused with AlreadyExists.
  //
  // The stream element is named for what it is rather than for this RPC: the
  // same event feed is what an admin TUI subscribes to, so tying the name to
  // one RPC would misname it everywhere else.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Attend(AttendRequest) returns (stream RoomEvent);
  // Send appends a message to the caller's room. A targeted message is a
  // mention of each role it names, or of everyone; an untargeted one is a
  // board post.
  rpc Send(SendRequest) returns (SendResponse);
  // Read returns messages of the caller's room from a cursor and moves the
  // caller's read position to the newest one shown. By default the first
  // ten unread mentions.
  rpc Read(ReadRequest) returns (ReadResponse);
  // CountUnread reports how many unread messages mention the caller. It
  // moves nothing; the caller asks before it wakes its agent.
  rpc CountUnread(CountUnreadRequest) returns (CountUnreadResponse);
  // ListMembers lists every member of the caller's room, team-qualified.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // ReportState records the state of the harness the caller runs under. It is
  // driven by harness hooks and gates keystroke-injection nudges, which are
  // only safe to deliver while the harness is idle.
  rpc ReportState(ReportStateRequest) returns (ReportStateResponse);
}

// ChatAdminService carries the host-side operations that participants must not
// be able to perform: inspecting every room, sending into any room without
// attending it, deleting rooms, and minting tokens for humans who have no
// provider entry.
//
// Access is proven per call by a credential the caller sends as the standard
// "authorization: Bearer <credential>" metadata, never as a request field, so a
// TLS-terminating proxy or an OIDC client can supply it the way they already
// supply one everywhere else.
//
// What the credential is depends on how the daemon is configured to
// authenticate. The age-identity setup makes it a challenge-response, since age
// encrypts without signing: GetNonce hands back a nonce encrypted to the
// configured recipient and the caller sends the decrypted nonce as its bearer
// credential. A setup that needs no challenge step answers GetNonce with
// UNIMPLEMENTED and takes whatever credential its issuer minted.
service ChatAdminService {
  // GetNonce issues a challenge for the caller to answer, when the daemon
  // authenticates in a way that has one. UNIMPLEMENTED means it does not.
  rpc GetNonce(GetNonceRequest) returns (GetNonceResponse);
  // ListRooms lists every room the log or attendance knows, with who attends.
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  // RegisterMember mints a token for a person and puts them in attendance
  // until the daemon restarts: the one attendance not held by a stream.
  rpc RegisterMember(RegisterMemberRequest) returns (RegisterMemberResponse);
  // Send delivers a message into a named room, targeted or as a board post,
  // without the caller attending that room.
  rpc Send(AdminSendRequest) returns (AdminSendResponse);
  // History returns a named room's messages without attending it and moves
  // no read position; same filter as Read, the unread cursor refused with
  // InvalidArgument and an unspecified cursor meaning TAIL.
  rpc History(AdminHistoryRequest) returns (AdminHistoryResponse);
  // DeleteRoom deletes a room's messages and read positions. Refused with
  // FailedPrecondition while somebody attends it.
  rpc DeleteRoom(DeleteRoomRequest) returns (DeleteRoomResponse);
}

// HarnessState is the state of the CLI harness a member runs under, as
// reported by that harness's hooks. Values mirror the vocabulary of
// `cmdman status set working|waiting|done`.
enum HarnessState {
  HARNESS_STATE_UNSPECIFIED = 0;
  // Working: the harness is working through a turn.
  HARNESS_STATE_WORKING = 1;
  // Waiting: the harness is showing a dialog (permission request or a
  // question) and would read a nudge as the answer to it.
  HARNESS_STATE_WAITING = 2;
  // Done: the harness finished its turn and is waiting for a new prompt. The
  // state a keystroke-injection nudge is meant for, and the only one it is
  // sent on sight; a working or waiting report is nudged too once it is old
  // enough to have stopped describing the terminal, since the hook that would
  // have reported the change can go missing.
  HARNESS_STATE_DONE = 3;
}

// MemberKind says whether a member runs an agent harness whose terminal a
// nudge may be typed into, or is anything else and is only ever handed its
// messages when it asks for them.
enum MemberKind {
  MEMBER_KIND_UNSPECIFIED = 0;
  MEMBER_KIND_AGENT = 1;
  MEMBER_KIND_HUMAN = 2;
}

// Harness names the CLI a member runs, as its MCP server reads it from the
// MCP handshake. Unspecified is a human or a server that could not tell.
enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE_CODE = 1;
  HARNESS_CODEX = 2;
  HARNESS_OPENCODE = 3;
  HARNESS_OTHER = 4;
}

// NudgeDelivery says how a mention reaches the member.
enum NudgeDelivery {
  NUDGE_DELIVERY_UNSPECIFIED = 0;
  // Terminal: the daemon types into the member's terminal (cmdman send-keys).
  NUDGE_DELIVERY_TERMINAL = 1;
  // Native: the member's MCP server delivers through the harness's own
  // channel; the daemon never types at it.
  NUDGE_DELIVERY_NATIVE = 2;
}

// Member is one participant of a room.
message Member {
  // Name is unique within Team, but may collide across the teams of a room;
  // a colliding name is addressed as "team/name".
  string name = 1;
  // Team groups members within a room. The cmdman-compose provider derives it
  // from the compose project of the caller's command.
  string team = 2;
  // Room is the chat room. The cmdman-compose provider derives it from the
  // working directory of the caller's command.
  string room = 3;
  // State is the harness state the member last reported, which is what tells
  // a reader whether the member can be interrupted. It is unspecified where no
  // state was recorded alongside the member: the sender a delivered message
  // carries is the identity as of send time rather than a live member.
  HarnessState state = 4;
  // Kind is what attends. It is unspecified only on a sender snapshot, which
  // records who spoke rather than who is attending.
  MemberKind kind = 5;
  // Harness is the CLI the member runs, as it declared on attending. It is
  // unspecified for a human and for an agent whose server could not tell.
  Harness harness = 6;
  // Nudge is how a mention reaches the member. An agent that declared none
  // attends as terminal; a human carries none at all, being never nudged.
  NudgeDelivery nudge = 7;
}

// Room is a chat room and its current attendance.
message Room {
  // Name identifies the room.
  string name = 1;
  // Members lists everyone attending, across all teams of the room.
  repeated Member members = 2;
}

// Target is who a message is for. Unset means a board post.
message Target {
  oneof target {
    Everyone everyone = 1;
    Roles roles = 2;
  }
}

// Everyone is the whole-room target; it carries nothing.
message Everyone {}

// Roles is an explicit list. A MemberTarget with an empty team is a bare name
// the daemon resolves in the sender's own team first, then uniquely across the
// room; a name two teams of the room carry is refused as ambiguous.
message Roles {
  repeated MemberTarget roles = 1;
}

// MemberTarget is one member. An empty Team resolves Name the way a bare
// name does for a member send: in the sender's team first -- the admin has
// none -- then uniquely across the room; a name carried by two teams is
// rejected as ambiguous and the error names them.
message MemberTarget {
  string team = 1;
  string name = 2;
}

// Message is one row of a room's conversation.
message Message {
  // Id is a UUID v7, unique everywhere.
  string id = 1;
  // Seq is the message's place in its room: dense, increasing, per room.
  // Read positions and since/until are seqs.
  int64 seq = 7;
  // From is the sender, as resolved at send time.
  Member from = 2;
  // Target is the written target: the roles as resolved, or everyone.
  // Unset for a board post.
  Target target = 3;
  // Text is the message body.
  string text = 4;
  // SentAt is when the daemon accepted the message.
  google.protobuf.Timestamp sent_at = 5;
  // MentionedYou is set on a message returned to a member that targets it
  // or everyone, was not sent by it, and lay past its read position before
  // this read.
  bool mentioned_you = 6;
}

message AttendRequest {
  // Name is the name to attend under, unique within the caller's team.
  string name = 1;
  // Kind declares what attends. It is required: a request leaving it
  // unspecified is refused with InvalidArgument rather than taken for a
  // human, since nudging the wrong kind types keystrokes into somebody's
  // shell.
  MemberKind kind = 2;
  // Harness is the CLI the attendee runs. Leaving it unspecified is allowed:
  // nothing the daemon does depends on it, and a server that cannot read the
  // harness off its handshake has nothing truthful to put here.
  Harness harness = 3;
  // Nudge is how a mention should reach the attendee. An agent leaving it
  // unspecified is nudged through its terminal, which is what every agent was
  // before a harness could deliver its own.
  NudgeDelivery nudge = 4;
}

// Attended is the first event of an Attend stream.
message Attended {
  // Self is the attending member, carrying the room and team the server
  // derived from the token.
  Member self = 1;
}

message SendRequest {
  // Target is optional. Unset is a board post.
  Target target = 3;
  // Text is the message body.
  string text = 2;
  reserved 1; // the former string to
}

message SendResponse {
  // Mentioned is every role the target resolved to. Empty for a post and for
  // everyone, which names no one in particular.
  repeated Member mentioned = 2;
  // Absent lists the mentioned roles nobody is attending under; the mention
  // waits for them. A client prints a warning per entry. A role that has
  // never attended is not absent but unknown: the send is refused.
  repeated Member absent = 3;
  reserved 1; // the former recipient
}

// ReadCursor is where a read starts. Unspecified means UNREAD on Read and
// TAIL on AdminHistory.
enum ReadCursor {
  READ_CURSOR_UNSPECIFIED = 0;
  // Unread: past the caller's read position, keeping only messages that
  // target the caller or everyone and were not sent by it. Member reads
  // only; AdminHistory refuses it.
  READ_CURSOR_UNREAD = 1;
  // Head: the room's first message.
  READ_CURSOR_HEAD = 2;
  // Tail: the room's last message.
  READ_CURSOR_TAIL = 3;
}

// ReadFilter is the one read shape, shared by Read and AdminHistory and
// mirrored by the CLI flags and the bridge tool arguments.
message ReadFilter {
  ReadCursor cursor = 1;
  // Range is how many messages from the cursor: forward when positive,
  // backward when negative. Zero means ten in the cursor's natural
  // direction: +10 for UNREAD and HEAD, -10 for TAIL. "unread +10" is the
  // first ten unread; "tail" alone the last ten of the room. A range against
  // the cursor's direction is refused with InvalidArgument: nothing lies
  // before HEAD or after TAIL, and UNREAD counts forward only.
  int32 range = 2;
  // To keeps messages naming any of the given roles, or everyone-kind
  // messages when it is everyone. Unset keeps every target, posts included.
  Target to = 3;
  // Since and Until bound the set by seq within the room, exclusive.
  int64 since = 4;
  int64 until = 5;
}

message ReadRequest {
  // A member read moves the caller's read position to the newest message it
  // shows, whichever cursor and filter were used.
  ReadFilter filter = 1;
}

message ReadResponse {
  repeated Message messages = 1;
  // RemainingUnread is how many unread mentions of the caller are left after
  // this read.
  int32 remaining_unread = 2;
}

message CountUnreadRequest {}

message CountUnreadResponse {
  // UnreadMentions is how many messages past the caller's read position
  // mention it. The read position does not move, so asking again gives the
  // same answer until the caller reads or somebody writes.
  int32 unread_mentions = 1;
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated Member members = 1;
}

message ReportStateRequest {
  // State is the harness state to record for the caller.
  HarnessState state = 1;
}

message ReportStateResponse {}

// MemberStateChanged signals that a member reported a new harness state.
message MemberStateChanged {
  // Member is whose state changed.
  Member member = 1;
  // State is the state the member now reports.
  HarnessState state = 2;
}

// MemberJoined signals that a member started attending the room.
message MemberJoined {
  Member member = 1;
}

// MemberLeft signals that a member withdrew its attendance.
message MemberLeft {
  Member member = 1;
}

// MessageAppended signals that a message was appended to the room's history.
message MessageAppended {
  Message message = 1;
}

// RoomEvent is a single notification about the attended room.
message RoomEvent {
  oneof event {
    Attended attended = 5;
    MemberStateChanged member_state_changed = 1;
    MemberJoined member_joined = 2;
    MemberLeft member_left = 3;
    MessageAppended message_appended = 4;
  }
}

message GetNonceRequest {}

message GetNonceResponse {
  // EncryptedNonce is the challenge nonce encrypted to the configured admin
  // age recipient. The caller decrypts it with the matching identity file and
  // sends the plaintext as the bearer credential of the next admin RPC.
  bytes encrypted_nonce = 1;
  // ExpiresAt is when the challenge stops being accepted.
  google.protobuf.Timestamp expires_at = 2;
}

message ListRoomsRequest {}

message ListRoomsResponse {
  repeated Room rooms = 1;
}

message RegisterMemberRequest {
  // Room is the room to register the member into.
  string room = 1;
  // Team is the team to register the member under.
  string team = 2;
  // Name is the name to register, unique within Team.
  string name = 3;
}

message RegisterMemberResponse {
  // Member is the registered member.
  Member member = 1;
  // Token is the daemon-issued identity token the registered member presents
  // as "x-crabswarm-token" on ChatService RPCs. It is shown only here.
  string token = 2;
}

message AdminSendRequest {
  // Room is the room to deliver into.
  string room = 1;
  // Text is the message body.
  string text = 3;
  // Target is optional. Unset is a board post.
  Target target = 4;
  reserved 2, 5, 6; // the former inline oneof cases
}

message AdminSendResponse {
  repeated Member mentioned = 2;
  repeated Member absent = 3;
  reserved 1;
}

message AdminHistoryRequest {
  // Room is the room whose conversation to read.
  string room = 1;
  ReadFilter filter = 4;
  reserved 2, 3; // the former limit and since_id
}

message AdminHistoryResponse {
  repeated Message messages = 2;
  reserved 1;
}

message DeleteRoomRequest {
  string room = 1;
}

message DeleteRoomResponse {
  int64 deleted_messages = 1;
}
