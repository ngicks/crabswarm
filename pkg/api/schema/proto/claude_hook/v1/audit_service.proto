syntax = "proto3";

package claude_hook.v1;

import "google/protobuf/timestamp.proto";
import "sdk_types/v1/hook.proto";

// AuditService provides audit logging for hook events.
service AuditService {
  // SendAuditEvent sends a single audit event to the server.
  rpc SendAuditEvent(AuditRequest) returns (AuditResponse);
}

// AuditRequest carries a PreToolUse hook input for audit logging.
message AuditRequest {
  // The pre-tool-use hook input.
  sdk_types.v1.PreToolUseHookInput input = 1;
  // When the event was captured by the client.
  google.protobuf.Timestamp timestamp = 2;
}

// AuditResponse is the server's acknowledgement. Empty; a successful RPC implies success.
message AuditResponse {}
