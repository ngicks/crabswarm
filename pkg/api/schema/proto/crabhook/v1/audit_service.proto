syntax = "proto3";

package crabhook.v1;

import "google/protobuf/timestamp.proto";
import "sdktypes/v1/types.proto";

option go_package = "github.com/ngicks/crabswarm/pkg/api/gen/proto/go/crabhook/v1;crabhookv1";

// AuditService provides audit logging for hook events.
service AuditService {
  rpc ReportHookInputEvent(ReportHookInputEventRequest) returns (ReportHookInputEventResponse);
}

message ReportHookInputEventRequest {
  google.protobuf.Timestamp timestamp = 1;
  bytes hook_input = 2;
}

message ReportHookInputEventResponse {}
